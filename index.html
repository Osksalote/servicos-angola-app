<!DOCTYPE html>
<html lang="pt">
<head>
  <!--
    Base path: replaced by the value of `--base-href` when running `flutter build web`.
  -->
  <base href="/servicos-angola-app/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Encontre profissionais de confiança perto de si em Angola. Verificados, avaliados e prontos a ajudar.">
  <meta name="theme-color" content="#0B6E4F">

  <!-- iOS meta tags & icons -->
  <!-- "Add to Home Screen" (Android and iPhone): opens full screen like an app. -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Serviços Angola">
  <link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Serviços Angola</title>
  <link rel="manifest" href="manifest.json">

  <!-- Loading screen: shown instantly (it is tiny) while the app downloads on slow internet. -->
  <style>
    html, body { margin: 0; height: 100%; background: #F5F7F4; }
    #loading {
      position: fixed; inset: 0; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 14px;
      font-family: Roboto, Arial, sans-serif; color: #1B1B1B;
      transition: opacity .25s;
    }
    #loading h1 { margin: 0; font-size: 24px; }
    #loading p { margin: 0; font-size: 14px; color: #555; }
    #loading .spin {
      width: 34px; height: 34px; border-radius: 50%;
      border: 4px solid #CFE3D6; border-top-color: #0B6E4F;
      animation: spin .9s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    /* iPhone: "install the app" hint (Safari only, until installed or closed). */
    #ios-install {
      position: fixed; left: 12px; right: 12px; bottom: calc(12px + env(safe-area-inset-bottom));
      z-index: 2147483647; display: none; gap: 10px; align-items: center;
      background: #fff; color: #1B2420; border: 1px solid #DDE3DE; border-radius: 16px;
      box-shadow: 0 8px 28px rgba(0,0,0,.18); padding: 12px 12px 12px 14px;
      font: 14px/1.4 Roboto, -apple-system, Arial, sans-serif;
    }
    #ios-install img { width: 40px; height: 40px; border-radius: 10px; flex: none; }
    #ios-install b { color: #0B6E4F; }
    #ios-install button { flex: none; border: 0; background: #F5F7F4; border-radius: 50%; width: 32px; height: 32px;
                          font-size: 18px; line-height: 32px; color: #555; cursor: pointer; }
  </style>
</head>
<body>
  <div id="loading">
    <!-- The app icon: a shield (trust) with a pin (near you) and a wrench (services). -->
    <svg width="88" height="88" viewBox="0 0 1024 1024" aria-hidden="true">
      <defs><linearGradient id="g" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#0E7A58"/><stop offset="1" stop-color="#084C37"/></linearGradient></defs>
      
      <path d="M12 1 3 5v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V5l-9-4z" transform="translate(8 8) scale(42)" fill="url(#g)"/>
      <g transform="translate(512 505) scale(0.68) translate(-512 -546)">
        <path d="M 512 860 C 436 762, 262 612, 262 432 A 250 250 0 1 1 762 432 C 762 612, 588 762, 512 860 Z" fill="#FFFFFF"/>
        <g transform="translate(512 442) rotate(45)">
          <circle cx="0" cy="-112" r="104" fill="#F2A541"/>
          <rect x="-40" y="-80" width="80" height="262" rx="40" fill="#F2A541"/>
          <rect x="-38" y="-240" width="76" height="118" fill="#FFFFFF"/>
          <circle cx="0" cy="-122" r="38" fill="#FFFFFF"/>
        </g>
      </g>
    </svg>
    <h1>Serviços Angola</h1>
    <div class="spin"></div>
    <p>A carregar…</p>
  </div>
  <script>
    // Remove the loading screen as soon as the app shows its first screen.
    window.addEventListener('flutter-first-frame', function () {
      var el = document.getElementById('loading');
      if (el) { el.style.opacity = '0'; setTimeout(function () { el.remove(); }, 300); }
    });
  </script>
  <div id="ios-install" role="dialog" aria-label="Instalar no iPhone">
    <img src="icons/apple-touch-icon.png" alt="">
    <div>Instale no iPhone: toque em <b>Partilhar</b>
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#0B6E4F" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-2px"><path d="M12 3v12"/><path d="M8 7l4-4 4 4"/><path d="M6 11v9h12v-9"/></svg>
      e depois em <b>“Adicionar ao ecrã principal”</b>.</div>
    <button type="button" aria-label="Fechar" onclick="document.getElementById('ios-install').style.display='none';try{localStorage.setItem('iosInstallHidden','1')}catch(e){}">×</button>
  </div>
  <script>
    // Show the iPhone install hint in Safari, only when the app isn't installed yet.
    (function () {
      var ua = navigator.userAgent;
      var ios = /iPhone|iPad|iPod/.test(ua) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
      var safari = ios && !/CriOS|FxiOS|EdgiOS|OPiOS|GSA/.test(ua);
      var installed = window.navigator.standalone === true || window.matchMedia('(display-mode: standalone)').matches;
      var hidden = false; try { hidden = localStorage.getItem('iosInstallHidden') === '1'; } catch (e) {}
      if (safari && !installed && !hidden) {
        window.addEventListener('flutter-first-frame', function () {
          setTimeout(function () { document.getElementById('ios-install').style.display = 'flex'; }, 2500);
        });
      }
    })();
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
